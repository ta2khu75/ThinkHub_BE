# Conversion to YAML from Properties formar report
# Warnings:
# - The yaml file had comments which are lost in the refactoring!
springdoc:
  swagger-ui:
    path: /swagger-ui
    enabled: true
  api-docs:
    path: ${app.api-prefix}/api-docs
    enabled: true
app:
  api-prefix: /api/v1
  frontend-url: http://localhost:3000
spring:
  application:
    name: thinkhub
  devtools:
    restart:
      enabled: true
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch-size: 50
        order-inserts: true
        order-updates: true
  datasource:
    url: jdbc:mysql://localhost:3366/think_hub
    username: root
    password: Bom474002
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5         # 🔹 Giữ số lượng connection tối đa thấp
      minimum-idle: 1              # 🔹 Chỉ giữ 1 connection rỗi để giảm RAM
      idle-timeout: 300000         # 5 phút - ngắt kết nối rảnh
      max-lifetime: 900000         # 15 phút - tái sử dụng connection
      connection-timeout: 10000    # 10s - đủ để client retry
      pool-name: HikariPool
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: boomkings474@gmail.com
    password: plvy vcph ixtr fxec
    properties:
      mail:
        smpt:
          auth: true
        smtp:
          starttls:
            enable: true
  data:
    jpa:
      repositories:
        bootstrap-mode: lazy
    redis:
      repositories:
        enabled: false
      host: singapore-keyvalue.render.com
      port: 6379
      username: ${redis.username}
      password: ${redis.password}
      ssl:
        enabled: true
#				###### Jackson ######
#				###### Loai bo cac truong co gia tri la null
#				spring.jackson.default-property-inclusion=non-null
#				###### Bo qua cac truong khong co trong class
#				spring.jackson.deserialization.fail-on-unknown-properties=false
#				###### Cac thuoc tinh tra ve se la kieu snake_case viet thuong
#				spring.jackson.property-naming-strategy=SNAKE_CASE
#				###### Tra ve kieu json theo format dep
#				spring.jackson.serialization.indent-output=true
  jackson:
    default-property-inclusion: non-null
    deserialization:
      fail-on-unknown-properties: false
    property-naming-strategy: SNAKE_CASE
    serialization:
      indent-output: true
  security:
   oauth2:
     client:
       registration:
         github:
            client-id: ${github.client-id}
            client-secret: ${github.client-secret}
            scope: user:email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
         google:
            client-id: ${google.client-id}
            client-secret: ${google.client-secret}
            scope:
              - openid
              - email
              - profile 
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
       provider:
         github:
           authorization-uri: https://github.com/login/oauth/authorize
           token-uri: https://github.com/login/oauth/access_token
           user-info-uri: https://api.github.com/user
           user-name-attribute: id
         google:
           authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
           token-uri: https://oauth2.googleapis.com/token
           user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
           user-name-attribute: sub
  modulith:
    detection-strategy: com.ta2khu75.thinkhub.config.CustomApplicationModuleDetectionStrategy
